eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  postprocess:
  - name: largest_cc
    min_fraction: 0.1
owner: Elena
idea: 'Post-processing only (no training): rescore current''s predictions, keeping
  per organ every 3D connected component at least 10% the size of the largest one.
  Plain largest-CC cut the esophagus, which the model predicts as several big fragments
  along z; the threshold should keep those while still removing the small stray blobs
  that inflate HD95.'
source: current
experiment: post_lcc_min_fraction
