owner: Elena
idea: 'Does HU windowing add value? This run disables the mediastinal HU window and
  falls back to legacy per-volume min-max intensity normalisation. Compare it against
  the baseline (current.yaml, which uses data.window [40, 400]). Same GT (segthor_full),
  split (holdout40), resampling, and seed (42), so the only variable is the intensity
  normalisation -> the Dice/HD95/NSD difference is the value of HU windowing.

  '
experiment: no_hu_window
_run:
  config_file: configs/experiments/no_hu_window.yaml
