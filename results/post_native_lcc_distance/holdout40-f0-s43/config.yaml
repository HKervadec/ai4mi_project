data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows: []
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 0
model:
  name: enet
  params:
    kernels: 8
    factor: 2
  pretrained: false
loss:
  name: ce
regularizers: []
optimizer:
  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: none
augment:
- combined
train:
  epochs: 25
  batch_size: 8
  seed: 43
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: largest_cc
    max_distance_mm: 20
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: Elena
idea: 'Post-processing only (no training): on spacing_native_384''s predictions, keep
  per organ the largest 3D connected component plus every component within 20 mm of
  it (largest_cc max_distance_mm), instead of by size (min_fraction 0.1). Real fragments
  of the esophagus lie next to the main part, stray blobs far away (seed 43: esophagus
  blobs ~6 cm in front; Patient_30: a heart fragment 126 mm away). Compare against
  post_native_lcc_min_fraction.'
source: spacing_native_384
experiment: post_native_lcc_distance
_run:
  config_file: configs/experiments/post_native_lcc_distance.yaml
  overrides:
  - train.seed=43
  source_run: results/spacing_native_384/holdout40-f0-s43
  started: '2026-10-07T16:38:52'
  git:
    commit: 1c69d2c
    branch: master
    dirty: true
