data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows: []
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 0
model:
  name: enet
  params:
    kernels: 8
    factor: 2
  pretrained: false
loss:
  name: ce_tversky
  alpha: 0.3
  beta: 0.7
  tversky_weight: 1.0
  include_background: false
regularizers: []
optimizer:
  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: none
augment:
- combined
train:
  epochs: 25
  batch_size: 8
  seed: 43
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: largest_cc
    min_fraction: 0.1
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: Puck
idea: 'CE + Tversky (alpha 0.3, beta 0.7: false negatives weighted more; organs only).
  Compare against loss_ce_dice (only the overlap term differs). On the old pipeline
  it matched CE+Dice on Dice but had worse HD95 from stray blobs, so judge it on metrics_3d_post.'
experiment: loss_ce_tversky
_run:
  config_file: configs/experiments/loss_ce_tversky.yaml
  overrides:
  - train.seed=43
  device: cuda
  debug: false
  started: '2026-10-07T20:23:29'
