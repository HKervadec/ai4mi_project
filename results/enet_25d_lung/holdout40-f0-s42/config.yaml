data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows:
  - - -600
    - 1500
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 1
model:
  name: enet
  params:
    kernels: 8
    factor: 2
  pretrained: false
loss:
  name: ce
regularizers: []
optimizer:
  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: none
augment:
- combined
train:
  epochs: 25
  batch_size: 8
  seed: 42
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: largest_cc
    min_fraction: 0.1
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: David
idea: 2.5D input (1 neighbour slice above/below) plus the lung window [-600, 1500]
  as extra channel per slice (6 input channels). Only the input differs from augmentation-native384
  (seeds 42, 43).
experiment: enet_25d_lung
_run:
  config_file: configs/experiments/enet_25d_lung.yaml
  overrides:
  - train.seed=42
  device: mps
  debug: false
  started: '2026-10-06T19:40:00'
  git:
    commit: fa66df6
    branch: master
    dirty: true
