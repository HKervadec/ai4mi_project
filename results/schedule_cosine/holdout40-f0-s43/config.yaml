data:
  gt: data/segthor_full
  window:
  - 40
  - 400
  extra_windows: []
  target_spacing:
  - 0.98
  - 0.98
  - 2.0
  shape:
  - 384
  - 384
  split: holdout40
  fold: 0
input:
  context_slices: 0
model:
  name: enet
  params:
    kernels: 8
    factor: 2
  pretrained: false
loss:
  name: ce
regularizers: []
optimizer:
  name: adam
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: cosine
augment:
- combined
train:
  epochs: 25
  batch_size: 8
  seed: 43
  num_workers: 5
  early_stopping:
    patience: null
    min_delta: 0.0
eval:
  metrics_3d:
  - dice
  - hd
  - hd95
  - assd
  - nsd
  - nsd3
  postprocess:
  - name: largest_cc
    min_fraction: 0.1
wandb:
  enabled: true
  entity: ai4migroup28
  project: ai4mi-segthor
owner: Elena
idea: CE with cosine lr decay (5e-4 -> 0 over 25 epochs) on the current pipeline.
  Only the scheduler differs from augmentation-native384 (seeds 42, 43, constant lr).
experiment: schedule_cosine
_run:
  config_file: configs/experiments/schedule_cosine.yaml
  overrides:
  - train.seed=43
  device: cuda
  debug: false
  started: '2026-10-07T20:18:18'
  git:
    commit: 860d278
    branch: master
    dirty: true
