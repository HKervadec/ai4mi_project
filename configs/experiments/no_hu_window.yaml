owner: Elena
idea: >
  Does HU windowing add value? This run disables the mediastinal HU window and
  falls back to legacy per-volume min-max intensity normalisation. Compare it
  against the baseline (current.yaml, which uses data.window [40, 400]). Same GT
  (segthor_full), split (holdout), and seed (42), so the only variable is
  the intensity normalisation -> the Dice/HD95/NSD difference is the value of
  HU windowing.

# Only override: turn off the HU window. Baseline keeps window: [40, 400].
data:
  window: null
