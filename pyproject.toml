[project]
name = "medical-imaging"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.11.1",
  "nibabel>=5.4.2",
  "numpy>=2.5.3",
  "pillow>=12.3.0",
  "rootutils>=1.0.7",
  "scikit-image>=0.26.0",
  "torch>=2.14.0",
  "torchvision>=0.29.0",
  "tqdm>=4.70.1",
  "tyro>=1.0.16",
  "wandb>=0.30.0",
]

[dependency-groups]
dev = ["ruff>=0.16.7"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
